# fly.toml - Fly.io konfiguratsiyasi
app = "ndu-exam-bot"
primary_region = "sin"  # Singapore (O'zbekistonga eng yaqin)

[build]
  builder = "paketobuildpacks/builder:base"

[env]
  PORT = "8080"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  min_machines_running = 1

  [[services.ports]]
    port = 80

[processes]
  bot = "python bot.py"
